<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぷにチェイン</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff3e0;--fg:#4a2f3a;--card:#ffd9e2;--accent:#ff5c8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3d;--fg:#fbeaff;--card:#43305e;--accent:#ff7fa8}}
:root[data-theme="dark"]{--bg:#2a1f3d;--fg:#fbeaff;--card:#43305e;--accent:#ff7fa8}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-weight:700}
.big{font-size:28px;line-height:1}
.lbl{font-size:12px;opacity:.7;display:block}
#enemy{display:flex;align-items:center;gap:12px;padding:0 18px}
#em{font-size:44px;line-height:1;transition:transform .1s}
#em.hit{transform:scale(.8) rotate(-8deg)}
#ei{flex:1;min-width:0}
#en{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
#en small{font-weight:400;opacity:.7}
#wk{width:12px;height:12px;border-radius:50%;display:inline-block}
.hp{height:10px;background:var(--card);border-radius:5px;overflow:hidden;margin-top:5px}
.hp i{display:block;height:100%;width:100%;transition:width .15s}
#ehp{background:var(--accent)}#eatk{background:#ffa94d;transition:none}#php{background:#51cf66}
#me{height:56px;box-sizing:border-box;display:flex;align-items:center;gap:10px;margin:0 18px 8px;font-size:12px}
#mel{flex:1;min-width:0}
#skb{min-width:108px;height:50px;font-size:14px;line-height:1.2;padding:2px 10px;border-radius:14px;border:3px solid var(--accent);color:var(--fg);background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--card) var(--p,0%))}
#skb small{font-size:11px}#skb.rd{color:#fff;box-shadow:0 0 0 3px var(--fg)}
#pv{display:inline-block;vertical-align:middle;margin-right:6px}#pv .pn{margin:0}
.pn{position:relative;display:block;width:1em;height:1em;margin:10px auto 2px;border-radius:50%;background:var(--c);box-shadow:inset 0 -.08em 0 rgba(0,0,0,.15),0 0 0 .04em rgba(0,0,0,.2)}
.pn::before{content:"";position:absolute;left:.26em;top:.4em;width:.14em;height:.18em;border-radius:50%;background:#2b2030;box-shadow:.34em 0 0 #2b2030}
.pn::after{content:"";position:absolute;left:.18em;top:.14em;width:.2em;height:.1em;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-30deg)}
.pn b{position:absolute;left:-.2em;right:-.2em;top:-.3em;text-align:center;font-size:.42em;font-style:normal;line-height:1}
#pn{position:fixed;inset:0;z-index:5;background:var(--bg);flex-direction:column;padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px);overflow:auto;touch-action:pan-y}
#ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 0;font-size:18px;position:sticky;top:0;background:var(--bg);z-index:1}
.tb{font-size:15px;padding:8px 14px;background:var(--card);color:var(--fg);border:2px solid var(--accent)}
.tb.on{background:var(--accent);color:#fff}
#grid,.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{position:relative;background:var(--card);border-radius:14px;padding:6px 4px 8px;text-align:center;font-size:11px;border:3px solid transparent}
.cd.sel{border-color:var(--accent)}.cd.lk{opacity:.5}.cd.lk .pn{filter:brightness(.3)}
.cd .nm{font-weight:800;font-size:13px}
.rk,.tg{position:absolute;top:5px;color:#fff;font-weight:800;font-size:10px;border-radius:6px;padding:1px 5px}
.rk{left:5px}.tg{right:5px;background:#ff6b6b}
.gb{margin:6px 4px 12px;font-size:16px;padding:10px 18px}.gb small{font-size:11px}
.dim{opacity:.8;margin:8px 0;font-size:12px;line-height:1.5}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}
.mr{display:flex;gap:10px}#cb{font-weight:700;margin:0}
#ds{display:flex}
#ms{position:relative;overflow:hidden;box-sizing:border-box;height:64px;display:flex;align-items:center;justify-content:center;margin:8px 14px 0;padding:10px 14px 14px;border-radius:16px;background:var(--card);border:3px solid var(--accent);font-size:17px;font-weight:800;text-align:center;line-height:1.3}
#ms .wd{display:inline-block;width:24px;height:24px;border-radius:50%;border:3px solid var(--fg);vertical-align:middle;margin:0 2px}
#mb{position:absolute;left:0;bottom:0;height:6px;width:0;background:var(--accent)}
#ms.warn{animation:bl .5s infinite alternate}
@keyframes bl{to{background:#ff8787;color:#fff}}
@media (prefers-reduced-motion:reduce){#ms.warn{animation:none;background:#ff8787;color:#fff}}
#ds{display:flex;flex-direction:column;gap:10px}
.dif{font-size:18px;padding:10px 32px}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#wrap.shake{animation:sh .3s}
@media (prefers-reduced-motion:reduce){#wrap.shake{animation:none}}
#wrap{flex:1;min-height:0;position:relative;margin:8px 0}
canvas{position:absolute;left:0;top:0;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:auto;background:color-mix(in srgb,var(--bg) 88%,transparent);text-align:center;padding:24px}
#ov h1{margin:0;font-size:34px}
#ov p{margin:0;max-width:260px;line-height:1.6}
button{font:inherit;font-weight:700;font-size:20px;padding:12px 36px;border:0;border-radius:999px;background:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#combo{position:absolute;left:0;right:0;top:6%;text-align:center;font-size:30px;font-weight:700;color:var(--accent);pointer-events:none;opacity:0;transition:opacity .3s}

.dif{font-size:15px;padding:10px 14px}
#ds{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dif:last-child{grid-column:1/-1}
#ph .tb{font-size:14px;padding:8px 10px}
#sks{display:flex;gap:5px}
.sk{width:58px;height:50px;font-size:11px;line-height:1.2;padding:2px;border-radius:12px;border:3px solid var(--accent);color:var(--fg);background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--card) var(--p,0%))}
.sk small{font-size:10px}.sk.rd{color:#fff;box-shadow:0 0 0 3px var(--fg)}
#cmbx{position:absolute;right:10px;top:4px;font-weight:800;font-size:18px;color:var(--accent);pointer-events:none;-webkit-text-stroke:1px var(--bg);paint-order:stroke fill}
#fl{position:absolute;inset:0;pointer-events:none;opacity:0}#fl.on{animation:fl .6s ease-out}
@keyframes fl{from{opacity:.6}to{opacity:0}}
#bn{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:44px;font-weight:900;color:#fff;pointer-events:none;opacity:0;-webkit-text-stroke:2px var(--bc);paint-order:stroke fill;text-shadow:0 3px 10px rgba(0,0,0,.4)}
#bn.on{animation:bn 1s ease-out}
@keyframes bn{0%{opacity:0;transform:scale(2.4)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@keyframes bnr{0%,70%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#fl.on{animation:none}#bn.on{animation:bnr 1s}}

button:disabled{opacity:.5}
#home{position:fixed;inset:0;z-index:4;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 14px);overflow:auto;touch-action:pan-y}
#hb{display:flex;justify-content:space-between;width:100%;font-size:20px;font-weight:800}
#home h1{margin:4px 0 0;font-size:38px}
#hpt{display:flex;gap:16px}.pm{text-align:center;font-size:12px;font-weight:700}
#home #ds{width:100%;max-width:340px}.dif small{font-size:11px;font-weight:400}
#home .tb{font-size:17px;padding:12px 18px}
#mg{position:fixed;inset:0;z-index:6;background:#3a9d4f;padding-top:env(safe-area-inset-top,0px)}
#mc{width:100%;height:100%}
#rr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.6);color:#fff;text-align:center;padding:24px}
#rr h1{margin:0;font-size:34px}#rr p{margin:0;font-size:20px;line-height:1.8}

.au{width:56px;height:40px;font-size:11px;line-height:1.2;padding:2px;border-radius:12px;border:3px solid var(--accent);color:var(--fg);background:var(--card)}.au.on{background:var(--accent);color:#fff}.au small{font-size:10px}
#al{padding:0 14px 20px}.ar{position:relative;background:var(--card);border-radius:12px;padding:8px 12px 10px;margin:0 0 8px;overflow:hidden}.ar b{display:block;font-size:14px}.ar span{font-size:12px;opacity:.85}.ar i{position:absolute;left:0;bottom:0;height:4px;background:var(--accent)}.ar.dn{opacity:.55}
#tst{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:9;display:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:13px;font-weight:700;line-height:1.6;text-align:center;width:max-content;max-width:90%;pointer-events:none}

.sk{background:linear-gradient(90deg,var(--ac,var(--accent)) var(--p,0%),var(--card) var(--p,0%))}.sk.rd{color:#222}

#hpt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:340px;gap:0}.pm{width:100%}
.cd,.pm{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#inf{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:24px}
.ic{position:relative;background:var(--bg);color:var(--fg);border-radius:20px;padding:18px 18px 12px;width:100%;max-width:320px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.ic h2{margin:2px 0 8px;font-size:22px}.ic p{margin:8px 0;font-size:14px;line-height:1.6}.ic small{font-size:12px;opacity:.8}
.it{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:14px;font-weight:700}.it span{background:var(--card);border-radius:10px;padding:6px 4px}
</style>
</head>
<body>
<header>
  <div><span class="lbl">倒した数</span><span class="big" id="sc">0</span></div>
  <div style="text-align:center"><span class="lbl">コイン</span><span class="big" id="cc">0</span></div>
  <div style="text-align:right"><span class="lbl">ベスト</span><span class="big" id="bs">0</span></div>
</header>
<div id="me"><div id="mel"><span id="pv"></span><span id="mn"></span><b id="pa" style="float:right"></b><div class="hp"><i id="php"></i></div></div><div id="sks"></div></div>
<div id="enemy"><div id="em">🟢</div><div id="ei"><div id="en"></div><div class="hp"><i id="ehp"></i></div><div class="hp" style="height:6px"><i id="eatk" style="width:0"></i></div></div><button id="au" class="au"></button></div>
<div id="ms"><div id="mt"></div><i id="mb"></i></div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="combo"></div><div id="cmbx"></div><div id="fl"></div><div id="bn"></div>
  <div id="ov" style="display:none"><h1 id="t"></h1><p id="m"></p><div class="mr"><button class="tb" id="rt">もう一度</button><button class="tb" id="hm">ホームへ</button></div></div>
</div>

<div id="home">
  <div id="hb"><span>🪙 <b id="hc">0</b></span><span>⭐ <b id="hp">0</b> pt</span></div>
  <h1>ぷにチェイン</h1>
  <div id="hpt"></div>
  <p class="dim" style="max-width:300px;text-align:center;margin:0">同じ色のぷにを3つ以上なぞってつなげて敵にダメージ。弱点の色は2倍！</p>
  <div id="ds"><button class="dif" data-d="easy"></button><button class="dif" data-d="normal"></button><button class="dif" data-d="hard"></button><button class="dif" data-d="expert"></button><button class="dif" data-d="hell"></button></div>
  <div class="mr"><button class="tb" data-o="g">ガチャ</button><button class="tb" data-o="u">育成</button><button class="tb" data-o="s">編成</button></div>
  <button class="tb" id="mgb">🏁 ぷにグランプリ（100pt）</button>
  <button class="tb" id="acb" data-o="a"></button>
  <p class="dim" id="hh" style="max-width:300px;text-align:center;margin:0"></p>
</div>
<div id="mg" style="display:none"><canvas id="mc"></canvas><div id="rr"><h1 id="rrt"></h1><p id="rrm"></p><button id="rrb">ホームへ</button></div></div>
<div id="inf" style="display:none"></div>
<div id="tst"></div>
<div id="pn" style="display:none"></div>
<script>
const COLORS=['#ff6b81','#4dabf7','#51cf66','#ffd43b','#b197fc'];
const COLS=6,ROWS=8;
// col:使う色数 hp:敵HP倍率 atk:反撃間隔倍率 dmg:敵ダメージ倍率
const DIFF={easy:{col:4,hp:.7,atk:1.4,dmg:.7,ms:1.4,cn:.5},normal:{col:5,hp:1,atk:1,dmg:1,ms:1,cn:.8},hard:{col:5,hp:1.5,atk:.7,dmg:1.3,ms:.8,cn:1.3},expert:{col:5,hp:2.2,atk:.55,dmg:1.7,ms:.7,cn:2},hell:{col:5,hp:3.2,atk:.4,dmg:2.2,ms:.6,cn:3}};
// 名前, 見た目, HP, 反撃間隔(秒), ダメージ
const ENEMIES=[['ぷるぷるスライム','🟢',90,6,10],['こうもりん','🦇',120,5,12],['タコまる','🐙',160,5,14],['おにおに','👹',210,4.5,16],['ドラゴン','🐉',300,4,20]];
const BOSS=[['ドラゴンロード','🐲',550,3.6,22],['まおう','😈',700,3.4,24],['クラーケン','🦑',850,3.2,26],['ゴーレム','🗿',1000,3,28]];
const RK=['N','R','SR','SSR','UR','UR⁺','UR⁺⁺'],RC=['#868e96','#339af0','#cc5de8','#f59f00','#ff2d95','#e03131','linear-gradient(90deg,#ff2d95,#f59f00,#40c057,#339af0,#7048e8)'],RM=[[1,1],[1.25,1.2],[1.6,1.45],[2.1,1.8],[2.7,2.3],[3.4,2.9],[4.4,3.7]],RATE=[.584,.28,.1,.02,.01,.005];
const SKN={heal:'ヒール',barrier:'バリア',stop:'ストップ',burst:'バースト',meteor:'メテオ',power:'パワー',weaken:'よわらせ',nova:'ノヴァ',fortress:'ようさい'};
const SKD={heal:'HPを35%回復',barrier:'5秒ダメージ無効',stop:'敵を6秒止める',burst:'次のつなぎが3倍',meteor:'敵のHPを35%削る',power:'攻撃力+0.5（ずっと）',weaken:'敵の攻撃力30%ダウン',nova:'敵HP60%ダメージ＋HP20%回復',fortress:'10秒ダメージ無効＋HP30%回復'};
// 名前, 得意色(COLORSの番号), かざり, ランク(0=N..3=SSR), HP, 攻撃, スキル, スキルがたまる数
const CH=[['ぷにまる',2,'',0,100,1,'heal',22],['ぷるる',1,'💧',0,90,1.1,'weaken',26],['もこぷに',3,'🌼',0,115,.9,'power',24],['ぽよん',4,'🎀',0,100,1,'stop',26],
['ほのぷに',0,'🔥',1,95,1.3,'meteor',24],['こおりん',1,'❄️',1,120,1.1,'stop',22],['はっぱん',2,'🍀',1,130,1,'heal',20],['びりぷに',3,'⚡',1,100,1.2,'weaken',22],
['おうじぷに',4,'👑',2,125,1.3,'power',22],['ほしぷに',3,'⭐',2,140,1.2,'meteor',20],['ひめぷに',0,'💖',3,150,1.4,'heal',18],['りゅうぷに',1,'🐉',3,140,1.6,'meteor',20],
['ふわぷに',0,'☁️',0,105,1,'heal',24],['みずぷに',1,'💦',0,95,1,'stop',25],['くさぷに',2,'🌱',0,110,.95,'barrier',24],['ひよぷに',3,'🐥',0,100,1.05,'burst',25],['ぶどぷに',4,'🍇',0,105,.95,'heal',23],['いちごん',0,'🍓',0,100,1,'barrier',25],['ソーダぷに',1,'🥤',0,90,1.1,'burst',26],['めろぷに',2,'🍈',0,115,.9,'stop',24],
['ほむらん',0,'🌋',1,100,1.25,'meteor',23],['しずくん',1,'🌊',1,125,1.1,'heal',21],['もりぷに',2,'🌳',1,130,1,'barrier',22],['ひかりん',3,'✨',1,105,1.2,'stop',21],['よるぷに',4,'🌙',1,110,1.2,'burst',22],['さくらん',0,'🌸',1,120,1.1,'heal',22],['つららん',1,'🧊',1,115,1.15,'stop',21],['でんぷに',3,'🔋',1,100,1.25,'power',22],
['まおうぷに',4,'😈',2,130,1.35,'weaken',21],['てんしぷに',3,'😇',2,140,1.2,'heal',20],['にんじゃぷに',1,'🌀',2,125,1.3,'stop',21],['ほのおうじ',0,'☄️',2,130,1.3,'burst',22],['もりのせい',2,'🧚',2,145,1.15,'heal',20],
['だいおうぷに',4,'🌌',3,150,1.5,'burst',18],['ふぶきひめ',1,'☃️',3,145,1.5,'stop',18],['ほうおうぷに',0,'🌅',3,150,1.45,'heal',18],
['にじぷに',3,'🌈',4,165,1.7,'nova',24],['ぎんがぷに',4,'💫',4,170,1.6,'fortress',20],['せいりゅう',1,'🐲',4,160,1.8,'meteor',20],['かみぷに',0,'👼',4,175,1.65,'power',16],
['こうりんぷに',3,'☀️',5,185,1.85,'nova',22],['げっこうぷに',4,'🌕',5,190,1.8,'fortress',20],['しんじゅぷに',1,'🔱',5,180,1.9,'meteor',20],
['きせきぷに',2,'💎',6,210,2.0,'nova',20],['てんちぷに',3,'🌠',6,200,2.1,'power',18]];
let sv={coins:150,own:{0:1},sel:0};
try{const x=JSON.parse(localStorage.getItem('puni-save'));if(x&&x.own)sv=x}catch(e){}
sv.party=(sv.party||[sv.sel||0]).filter(i=>sv.own[i]).slice(0,3);for(let i=0;sv.party.length<3&&i<CH.length;i++)if(!sv.party.includes(i)&&(sv.own[i]||i<3)){sv.own[i]=sv.own[i]||1;sv.party.push(i)}sv.lv=sv.lv||{};sv.pts=sv.pts||0;sv.st=Object.assign({k:0,b:0,r:0,pl:0,mc:0,rb:0},sv.st);sv.ac=sv.ac||{};sv.auto=!!sv.auto;
const save=()=>{try{localStorage.setItem('puni-save',JSON.stringify(sv))}catch(e){}};
const star=i=>Math.min(5,(sv.own[i]||1)-1);
const LVMAX=10,lvl=i=>sv.lv[i]||1,lvCost=i=>Math.round((40+20*lvl(i))*(1+CH[i][3]*.5));
const stat=i=>{const c=CH[i],m=RM[c[3]],q=1+.1*star(i)+.06*(lvl(i)-1);return{hp:Math.round(c[4]*m[0]*q),atk:+(c[5]*m[1]*q).toFixed(2)}};
let ch=CH[sv.sel]||CH[0],sg=0,burst=0,barrier=0,freeze=0,pmax=100,ab=1,runCoins=0,gres='';
let pw=1,mi=null,mscd=0,_h='',pm='s',cmb=0,ct=0,cm=1,sgs=[0,0,0],fxs=[],pt=[],sbs=[],ax=0;
const mkp=(i,z)=>'<div class="pn" style="--c:'+COLORS[CH[i][1]]+';font-size:'+z+'px"><b>'+CH[i][2]+'</b></div>';
function card(i,tag){
  const c=CH[i],t=stat(i);

    ctx.lineWidth=S*.16;ctx.lineCap=ctx.lineJoin='round';ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();

  pops=pops.filter(p=>(p.t+=dt)<.4);
  pops.forEach(p=>{
    const k=p.t/.4,x=ox+(p.x+.5)*S,y=oy+(p.y+.5)*S;
    ctx.globalAlpha=1-k;ctx.fillStyle=p.col;
    for(let i=0;i<6;i++){const a=i*1.047+.3,d=S*(.3+.5*k);ctx.beginPath();ctx.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,S*.1*(1-k),0,7);ctx.fill()}
    ctx.globalAlpha=1;
  });
  fxs=fxs.filter(p=>(p.t+=dt)<.9);
  fxs.forEach(p=>{const k=p.t/.9;ctx.globalAlpha=1-k;if(p.ring){ctx.lineWidth=S*.3*(1-k);ctx.strokeStyle=p.col;ctx.beginPath();ctx.arc(W/2,H/2,S*6*k,0,7);ctx.stroke();return}ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(W/2+Math.cos(p.a)*p.v*k,H/2+Math.sin(p.a)*p.v*k,p.r*(1-k*.6),0,7);ctx.fill()});
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}
const mcv=$('mc'),mx=mcv.getContext('2d');let rc=null;
function raceStart(){
  if(sv.pts<100||(rc&&rc.on))return;
  sv.pts-=100;save();coinTxt();
  const d=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;
  mcv.width=W*d;mcv.height=H*d;mx.setTransform(d,0,0,d,0,0);
  rc={W,H,tp:parseFloat(getComputedStyle($('mg')).paddingTop)||0,t:30,gp:0,gear:1,pg:1,mg:1,gu:0,sc:0,x:1,ln:1,it:[],sp:.5,cr:0,off:0,on:1,l:0};
  $('rr').style.display='none';$('mg').style.display='block';requestAnimationFrame(raceLoop);
}
function raceEnd(){
  rc.on=0;const sc=Math.floor(rc.sc),cn=Math.round(sc*.8);sv.coins+=cn;sv.st.rb=Math.max(sv.st.rb,sc);save();coinTxt();ach();
  $('rrt').textContent='タイムアップ！';
  $('rrm').innerHTML='スコア '+sc+'<br>最高ギア '+rc.mg+'<br>🪙 コイン +'+cn;
  $('rr').style.display='flex';
}
function raceLoop(ts){
  if(!rc||!rc.on)return;
  const dt=rc.l?Math.min((ts-rc.l)/1000,.05):.016;rc.l=ts;
  const {W,H,tp}=rc,lw=Math.min(W,420)/3,x0=(W-lw*3)/2,py=H*.78;
  if(rc.t>0){
    rc.t-=dt;rc.gp+=dt;rc.cr-=dt;rc.gu-=dt;
    rc.gear=Math.min(5,1+Math.floor(rc.gp/4));if(rc.gear>rc.pg)rc.gu=.9;rc.pg=rc.gear;rc.mg=Math.max(rc.mg,rc.gear);
    rc.sc+=dt*rc.gear*12;rc.x+=(rc.ln-rc.x)*Math.min(1,dt*12);
    const v=(H*.35+rc.gear*H*.12)*(rc.cr>0?.5:1);rc.off+=v*dt;
    if((rc.sp-=dt)<=0){rc.sp=Math.max(.35,1.1-rc.gear*.12);rc.it.push({l:Math.floor(Math.random()*3),y:-lw,b:Math.random()<.28})}
    rc.it.forEach(o=>{o.y+=v*dt;if(Math.abs(o.l-rc.x)<.65&&Math.abs(o.y-py)<lw*.5){if(o.b){o.d=1;rc.gp+=4;rc.sc+=40}else if(rc.cr<=0){o.d=1;rc.cr=.8;rc.gp=Math.max(0,rc.gp-8)}}});
    rc.it=rc.it.filter(o=>!o.d&&o.y<H+lw);
    if(rc.t<=0)raceEnd();
  }
  mx.shadowColor='rgba(0,0,0,.5)';mx.shadowBlur=0;
  mx.fillStyle='#3a9d4f';mx.fillRect(0,0,W,H);
  mx.fillStyle='#555a63';mx.fillRect(x0,0,lw*3,H);
  mx.fillStyle='#fff';mx.fillRect(x0-4,0,4,H);mx.fillRect(x0+lw*3,0,4,H);
  mx.strokeStyle='#fff';mx.lineWidth=4;mx.setLineDash([lw*.35,lw*.35]);mx.lineDashOffset=-rc.off;
  for(let i=1;i<3;i++){mx.beginPath();mx.moveTo(x0+lw*i,0);mx.lineTo(x0+lw*i,H);mx.stroke()}
  mx.setLineDash([]);
  mx.font=(lw*.5)+'px sans-serif';mx.textAlign='center';mx.textBaseline='middle';mx.fillStyle='#fff';
  rc.it.forEach(o=>mx.fillText(o.b?'⚡':'🚧',x0+lw*(o.l+.5),o.y));
  const px=x0+lw*(rc.x+.5),r=lw*.3;
  if(rc.cr<=0||Math.floor(rc.cr*12)%2){
    mx.beginPath();mx.arc(px,py,r,0,7);mx.fillStyle=COLORS[0];mx.fill();
    for(const s of[-1,1]){mx.beginPath();mx.arc(px+s*r*.35,py-r*.1,r*.2,0,7);mx.fillStyle='#fff';mx.fill();mx.beginPath();mx.arc(px+s*r*.37,py-r*.08,r*.09,0,7);mx.fillStyle='#2b2030';mx.fill()}
  }
  mx.shadowBlur=4;mx.fillStyle='#fff';mx.font='700 20px sans-serif';
  mx.textAlign='left';mx.fillText('TIME '+Math.max(0,Math.ceil(rc.t)),16,tp+30);
  mx.textAlign='right';mx.fillText('SCORE '+Math.floor(rc.sc),W-16,tp+30);
  mx.textAlign='center';mx.font='800 34px sans-serif';mx.fillText('GEAR '+rc.gear,W/2,tp+74);
  for(let i=0;i<5;i++){mx.fillStyle=i<rc.gear?'#ffd43b':'rgba(255,255,255,.3)';mx.fillRect(W/2-70+i*28,tp+92,24,10)}
  if(rc.gu>0){mx.fillStyle='#ffd43b';mx.font='900 44px sans-serif';mx.fillText('GEAR UP!',W/2,H*.4)}
  if(rc.t>26){mx.fillStyle='#fff';mx.font='700 18px sans-serif';mx.fillText('タップ・スライドで移動！⚡でギアアップ',W/2,H*.5)}
  mx.shadowBlur=0;
  requestAnimationFrame(raceLoop);
}
